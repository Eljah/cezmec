name: Verify Cezmec
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify 3D assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 tools/verify_media.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test Java
        run: mvn -B -ntp verify
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check geometry
        run: node --test tests/geometry.test.js
      - name: Install browser tests and check bundled Edge
        run: |
          npm install --ignore-scripts
          test -x /opt/microsoft/msedge/msedge
          /opt/microsoft/msedge/msedge --version
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - name: Archive source
        if: always()
        run: git archive --format=zip --output=cezmec-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cezmec-build
          path: |
            target/cezmec-*.jar
            target/surefire-reports/
            test-results/
            playwright-report/
            cezmec-source.zip
          if-no-files-found: error
