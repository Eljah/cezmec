spring.application.name=cezmec
server.port=${PORT:8080}
spring.datasource.url=${CEZMEC_DB_URL:jdbc:h2:file:./data/cezmec;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=${CEZMEC_DB_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.tomcat.max-http-form-post-size=64KB
spring.servlet.multipart.enabled=false
cezmec.admin-token=${CEZMEC_ADMIN_TOKEN:}
cezmec.seed-examples=${CEZMEC_SEED_EXAMPLES:true}
